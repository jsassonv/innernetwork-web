<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm your company email — Inner Network</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  :root {
    --navy: #2f354a;
    --cream: #ece5d4;
    --cream-card: #f7f3ea;
    --cream-line: #d9d0ba;
    --muted: #6b7180;
    --gold: #b08a4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--cream); color: var(--navy);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    width: 100%; max-width: 460px; background: var(--cream-card); border: 1px solid var(--cream-line);
    border-radius: 24px; padding: 44px 32px; text-align: center;
    box-shadow: 0 20px 40px -20px rgba(47, 53, 74, 0.25);
  }
  .logo { width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 24px; display: block; }
  .mark { font-size: 44px; line-height: 1; margin-bottom: 16px; }
  h1 { font-size: 24px; margin: 0 0 10px; font-weight: 700; letter-spacing: -0.01em; }
  p { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0 0 20px; }
  .spinner {
    width: 28px; height: 28px; border: 3px solid var(--cream-line); border-top-color: var(--gold);
    border-radius: 50%; margin: 8px auto 20px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.btn {
    display: inline-block; background: var(--navy); color: #fff; text-decoration: none;
    padding: 12px 22px; border-radius: 12px; font-weight: 600; font-size: 15px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="logo" src="/assets/logo.png" alt="Inner Network">
      <div id="content">
        <div class="spinner"></div>
        <h1>Confirming your email…</h1>
        <p>One moment.</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var FUNCTION_URL = "https://dwfuvfcjptvycqyedetb.supabase.co/functions/v1/verify-company-email";
      var content = document.getElementById("content");

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function render(mark, title, body) {
        content.innerHTML =
          '<div class="mark">' + mark + '</div>' +
          '<h1>' + esc(title) + '</h1>' +
          '<p>' + body + '</p>' +
          '<a class="btn" href="/download">Open the app</a>';
      }

      var token = new URLSearchParams(window.location.search).get("token") || "";
      if (!token) {
        render("⚠️", "Link not recognized", "This confirmation link is missing its code. Open the link from your email again.");
        return;
      }

      fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token })
      })
        .then(function (res) { return res.json().catch(function () { return {}; }); })
        .then(function (data) {
          switch (data.status) {
            case "verified":
              render("✅", "You're confirmed",
                "Your company email is verified" + (data.company ? " for <strong>" + esc(data.company) + "</strong>" : "") + ". Nothing else to do.");
              break;
            case "expired":
              render("⌛", "This link has expired",
                "Confirmation links last 7 days. Save your profile again in the app and we'll send a fresh one.");
              break;
            case "email_changed":
              render("✉️", "Email changed",
                "Your company email in the app is different from the one this link was sent to. Save your profile again to get a new link.");
              break;
            default:
              render("⚠️", "Link not recognized",
                "This confirmation link isn't valid. Save your profile again in the app and we'll send a fresh one.");
          }
        })
        .catch(function () {
          render("⚠️", "Something went wrong",
            "We couldn't reach the server. Check your connection and open the link again.");
        });
    })();
  </script>
</body>
</html>
