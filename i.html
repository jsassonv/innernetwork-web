<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src https://dwfuvfcjptvycqyedetb.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Invitation · Inner Network</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2">
<link rel="stylesheet" href="/assets/hosted.css?v=1">
<!--
  A guest's own invitation (Docs/2.0_Hosted_Events_Plan.md): innernetwork.app/i/<token>, from the invitation email.
  The token is the only key, so the page never shows anyone else's details. ?a=going|maybe|declined answers straight
  from the email's buttons; ?a=confirm confirms a meeting; ?a=unsubscribe stops emails about this event.
-->
</head>
<body>
<div class="wrap">
  <a class="brand" href="/"><img src="/assets/logo.png" alt="">Inner Network</a>
  <main id="main"><p class="status">Loading…</p></main>
  <footer>&copy; 2026 WAVECODE LLC · <a href="/privacy-policy.html">Privacy Policy</a> · <a href="/terms.html">Terms</a></footer>
</div>
<script src="/assets/hosted.js?v=1"></script>
<script>
(function () {
  var H = window.HOSTED, t = H.t, esc = H.esc;
  var params = new URLSearchParams(location.search);
  var token = (params.get("t") || "").toLowerCase();
  var action = params.get("a") || "";
  var data = null;
  if (!/^[0-9a-f]{36}$/.test(token)) return H.fail();

  function render(message) {
    var e = data.event, g = data.guest, going = g.status === "going";
    var ended = new Date(e.ends_at).getTime() < Date.now();
    // Only an invitation says "invited you"; someone who registered themselves just sees their answer.
    var inviters = g.source === "host" ? H.hostNames(data.inviters) : "";
    var questions = Array.isArray(e.questions) ? e.questions : [];
    var answers = Array.isArray(g.answers) ? g.answers : [];
    var answerOf = function (q) { var a = answers.filter(function (x) { return x.q === q; })[0]; return a ? a.a : ""; };
    document.title = e.name + " · Inner Network";
    var choice = function (s, emoji, label) {
      return '<button type="button" data-s="' + s + '" aria-pressed="' + (g.status === s) + '"><span aria-hidden="true">' + emoji + '</span>' + t(label) + '</button>';
    };
    document.getElementById("main").innerHTML =
      '<div class="grid"><div>' + H.flyer(e) + '</div><div class="side">' +
      '<div><div class="kind">' + esc(e.kind_name) + '</div><h1>' + esc(e.name) + '</h1>' +
      (inviters ? '<p class="invited">' + (g.first_name ? esc(g.first_name) + ', ' : '') + '<strong>' + esc(inviters) + '</strong> ' + t("invited you") + '.</p>' : '') +
      H.facts(e) + '</div>' +
      (ended ? '<p class="note">' + t("This event has ended.") + '</p>' :
        '<section class="panel" aria-labelledby="ans"><h2 id="ans">' + t(g.status === "invited" ? "Answer this invitation" : "Your answer") + '</h2>' +
        '<div class="answers">' + choice("going", "👍", "Going") + choice("maybe", "🤔", "Maybe") + choice("declined", "🙁", "Can't go") + '</div>' +
        '<p class="err" id="err" role="alert"></p>' +
        (message ? '<p class="ok" role="status">' + esc(message) + '</p>' : '') +
        (going ? '<p style="margin:10px 0 0"><a class="btn out" href="' + H.FN + '?format=ics&token=' + token + '">' + t("Add to calendar") + '</a></p>' : '') +
        (going && (questions.length || data.texts_available) ?
          '<form id="more" style="margin-top:14px">' +
          questions.map(function (q, i) { return '<label>' + esc(q) + '<input name="q' + i + '" maxlength="500" value="' + esc(answerOf(q)) + '"></label>'; }).join("") +
          (data.texts_available ? '<label class="check"><input type="checkbox" name="sms"' + (g.sms_opt_in ? " checked" : "") + '><span>' + esc(t("sms")) + '</span></label>' +
            '<label>' + t("Mobile phone") + '<input name="phone" type="tel" autocomplete="tel" maxlength="30" placeholder="' + (g.has_phone ? "••• ••• ••••" : "") + '"></label>' : '') +
          '<button class="btn" type="submit">' + t("Save") + '</button></form>' : '') +
        '</section>') +
      H.details(e) + '</div></div>';
    document.querySelectorAll(".answers button").forEach(function (b) { b.addEventListener("click", function () { answer(b.getAttribute("data-s")); }); });
    var more = document.getElementById("more");
    if (more) more.addEventListener("submit", function (ev) {
      ev.preventDefault();
      answer("going", {
        answers: questions.map(function (q, i) { return { q: q, a: (more.elements["q" + i] || {}).value || "" }; }),
        sms_opt_in: !!(more.elements.sms && more.elements.sms.checked),
        phone: more.elements.phone ? more.elements.phone.value : ""
      }, t("Saved."));
    });
  }

  function answer(status, extra, okMessage) {
    var body = Object.assign({ status: status, answers: data.guest.answers || [] }, extra || {});
    var err = document.getElementById("err"); if (err) err.textContent = t("Sending…");
    H.post("?format=rsvp&token=" + token, body).then(function (r) {
      if (!r.ok) {
        if (err) err.textContent = r.body && r.body.error === "full" ? t("This event is full.") : t(r.status === 429 ? "Too many tries. Please wait a few minutes." : "That didn't work. Please try again.");
        return;
      }
      data.guest.status = r.body.status;
      if (extra) { data.guest.answers = body.answers; data.guest.sms_opt_in = body.sms_opt_in; if (body.phone) data.guest.has_phone = true; }
      render(okMessage || (r.body.status === "going" ? t("You're going. See you there.") : r.body.status === "waitlist" ? t("You're on the waitlist. We'll email you if a spot opens.") : t("Thanks, we let the host know.")));
    }).catch(function () { if (err) err.textContent = t("That didn't work. Please try again."); });
  }

  H.get("?format=invite&token=" + token).then(function (r) {
    if (!r.ok) return H.fail();
    data = r.body;
    H.accent(data.event);
    // Answers straight from the email's buttons, once.
    if (action === "unsubscribe") {
      H.post("?format=unsubscribe&token=" + token).then(function () { render(t("You won't get more emails about this event.")); });
    } else if (action === "confirm") {
      answer("going", null, t("Confirmed. Thank you."));
    } else if (/^(going|maybe|declined)$/.test(action) && data.guest.status !== action) {
      render(); answer(action);
    } else {
      render();
    }
    if (action) history.replaceState(null, "", location.pathname + "?t=" + token);
  }).catch(function () { H.fail(); });
})();
</script>
</body>
</html>
