<style>
  :root {
    --navy: #2f354a;
    --navy-dark: #262b3d;
    --cream: #ece5d4;
    --cream-card: #f7f3ea;
    --cream-line: #d9d0ba;
    --muted: #6b7180;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--cream); color: var(--navy);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 460px; background: var(--cream-card); border: 1px solid var(--cream-line);
    border-radius: 24px; padding: 44px 32px; text-align: center;
    box-shadow: 0 20px 40px -20px rgba(47, 53, 74, 0.25);
  }
  .logo {
    width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 24px;
    display: block; box-shadow: 0 8px 20px -6px rgba(47, 53, 74, 0.35);
  }
  h1 {
    font-size: 24px; margin: 0 0 10px; font-weight: 700; letter-spacing: -0.01em;
  }
  p { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0 0 28px; }

  .store-badges {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 8px;
  }
  .store-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--navy);
    color: var(--cream);
    text-decoration: none;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .store-badge:hover { background: var(--navy-dark); }
  .store-badge svg { flex-shrink: 0; }
  .store-badge .badge-text { text-align: left; line-height: 1.15; }
  .store-badge .badge-text .small { display: block; font-size: 10px; opacity: 0.85; }
  .store-badge .badge-text .big { display: block; font-size: 17px; font-weight: 600; }

  .store-badge.coming-soon {
    background: transparent;
    color: var(--navy);
    border: 1px solid var(--navy);
    opacity: 0.7;
    cursor: default;
  }
  .store-badge.coming-soon:hover { background: rgba(47, 53, 74, 0.06); }

  .footer-note {
    margin-top: 24px; font-size: 12px; color: var(--muted); letter-spacing: 0.02em;
  }
  .footer-note a { color: var(--muted); text-decoration: underline; }
</style>

          </svg>
          <span class="badge-text">
            <span class="small">Download on the</span>
