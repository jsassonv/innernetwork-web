<style>
  @font-face { font-family: "Sign Script"; src: url("/assets/fonts/DancingScript.woff2") format("woff2"); font-display: swap; }
  .wrap { max-width: 860px; }
  .doc-head h1 { margin: 0 0 6px; font-size: 26px; }
  .doc-head .from { margin: 0 0 10px; color: #5B6170; }
  .doc-head .msg { background: #fff; border-radius: 14px; padding: 12px 14px; white-space: pre-wrap; margin: 0 0 14px; }
  .steps { margin: 0 0 14px; padding: 12px 14px; background: #FBF3E2; border-radius: 14px; font-size: 15px; }
  .steps strong { color: #725A34; }
  #pages { display: flex; flex-direction: column; gap: 14px; }
  .page { position: relative; background: #fff; box-shadow: 0 1px 6px rgba(31,35,48,.16); border-radius: 4px; overflow: hidden; }
  .page canvas { display: block; width: 100%; height: auto; }
  .page .num { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: #8A8F9C; background: rgba(255,255,255,.8); padding: 1px 6px; border-radius: 8px; }
  .fld { position: absolute; box-sizing: border-box; border: 2px solid #B08D57; background: rgba(176,141,87,.14); border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: #725A34; cursor: pointer; padding: 0; overflow: hidden; font-family: inherit; }
  .fld.done { background: rgba(255,255,255,.75); border-color: #4B7357; color: #1F2330; font-weight: 500; }
  .fld img { max-width: 100%; max-height: 100%; display: block; }
  .fld input { width: 100%; height: 100%; border: 0; background: transparent; font: inherit; font-weight: 500; color: #1F2330; padding: 0 6px; min-width: 0; font-size: 14px; }
  .fld.auto { cursor: default; }
  .fld.next { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(176,141,87,.28); } }
  @media (prefers-reduced-motion: reduce) { .fld.next { animation: none; } }
  .bar { margin-top: 16px; background: #fff; border-radius: 18px; box-shadow: 0 1px 6px rgba(31,35,48,.16); padding: 16px; }
  /* A small floating button that always leads to the next thing to do, so the document stays readable on a phone. */
  #nextBtn { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10; border: 0; border-radius: 999px; padding: 13px 20px; background: #1F2330; color: #fff;
    font: inherit; font-weight: 600; font-size: 15px; box-shadow: 0 4px 14px rgba(31,35,48,.35); cursor: pointer; }
  .bar label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 4px; }
  .bar input[type=text] { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #D9D3C7; border-radius: 12px; font: inherit; font-size: 16px; }
  .bar .agree { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0; font-size: 14px; line-height: 1.4; font-weight: 400; }
  .bar .agree input { width: 20px; height: 20px; margin-top: 1px; flex: none; }
  .bar .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .bar .btn { flex: 1 1 200px; text-align: center; }
  .bar .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .dialog-back { position: fixed; inset: 0; background: rgba(31,35,48,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .dialog { background: #fff; width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
  @media (min-width: 640px) { .dialog-back { align-items: center; } .dialog { border-radius: 20px; } }
  .dialog h2 { margin: 0 0 10px; font-size: 19px; }
  .tabs { display: flex; gap: 8px; margin: 0 0 10px; }
  .tabs button { flex: 1; padding: 9px; border-radius: 999px; border: 1px solid #D9D3C7; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .tabs button[aria-pressed=true] { background: #1F2330; color: #fff; border-color: #1F2330; }
  #pad { width: 100%; height: 180px; border: 1px dashed #B08D57; border-radius: 14px; touch-action: none; background: #FFFDF8; display: block; }
  #typed { width: 100%; box-sizing: border-box; height: 180px; border: 1px dashed #B08D57; border-radius: 14px; background: #FFFDF8; text-align: center; font-family: "Sign Script", cursive; font-size: 46px; color: #1B1F2B; padding: 0 12px; }
  .dialog .row { display: flex; gap: 10px; margin-top: 12px; }
  .dialog .row .btn { flex: 1; text-align: center; }
  .done-box { text-align: center; padding: 30px 10px; }
  .done-box h1 { margin: 0 0 8px; }
  .done-box .status { margin: 0 0 22px; padding: 0; min-height: 0; }
</style>

<body>
<div class="wrap">
  <a class="brand" href="/"><img src="/assets/home/mark.png" alt="" width="13" height="34">Inner Network</a>
  <main id="main"><p class="status">Loading…</p></main>
  <footer>&copy; 2026 WAVECODE LLC · <a href="/privacy-policy.html">Privacy Policy</a> · <a href="/terms.html">Terms</a></footer>
</div>
<script src="/assets/pdfjs/pdf.min.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var token = (params.get("t") || "").toLowerCase();
  var FN = "https://" + (params.get("test") === "1" ? "eanaccexbjiebxqlouzb" : "dwfuvfcjptvycqyedetb") + ".supabase.co/functions/v1/esign";
  var main = document.getElementById("main");
  var data = null, signature = null, values = {}, busy = false;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function box(title, text, extra) { main.innerHTML = '<div class="done-box"><h1>' + esc(title) + '</h1><p class="status">' + esc(text) + '</p>' + (extra || "") + '</div>'; }
  function call(body) {
    return fetch(FN, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); });
  }
  var REASONS = {
    not_found: "This signing link isn't valid. Open the link from your email again.",
    closed: "This document is closed and can't be signed anymore.",
    already_done: "This document is already complete.",
    already_signed: "You've already signed this document.",
    consent_needed: "Please tick the box to agree to sign electronically.",
    name_needed: "Please type your full name.",
    signature_needed: "Please add your signature.",
    field_needed: "Please fill in every required box."
  };
  function reasonText(res) {
    var e = res && res.body && res.body.error;
    if (e && e.code === "RATE_LIMITED") return "Too many tries. Please wait a few minutes.";
    return (e && REASONS[e.reason]) || "Something went wrong. Please try again.";
  }
  function today() { return new Date().toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }); }

  if (!/^[0-9a-f]{40}$/.test(token)) return box("Link not valid", REASONS.not_found);
  load();

  function load() {
    call({ action: "view", token: token }).then(function (res) {
      if (!res.ok) return box("We couldn't open this", reasonText(res));
      data = res.body;
      render();
    }).catch(function () { box("We couldn't open this", "Check your connection and try again."); });
  }

  function downloadLink(label) {
    return data.pdf_url ? '<p><a class="btn" href="' + esc(data.pdf_url) + '" target="_blank" rel="noopener">' + esc(label) + '</a></p>' : "";
  }

  function render() {
    var d = data.document, st = d.status, me = data.me;
    if (st === "voided") return box("This document was canceled", data.sender.name + " canceled this request. There is nothing to sign.");
    if (st === "declined") return box("This document is closed", me.status === "declined" ? "You declined to sign. " + data.sender.name + " has been told." : "A signer declined, so this document is closed.");
    if (st === "completed") return box("Everyone has signed", '"' + d.title + '" is complete. A copy was also emailed to you.', downloadLink("Download the signed document"));
    if (me.status === "signed") {
      var waiting = data.others.filter(function (o) { return o.status !== "signed"; }).map(function (o) { return o.name; });
      return box("You've signed", waiting.length ? "Waiting for: " + waiting.join(", ") + ". You'll get the finished copy by email when everyone has signed." : "You'll get the finished copy by email.");
    }
    main.innerHTML =
      '<div class="doc-head"><h1>' + esc(d.title) + '</h1>' +
      '<p class="from">' + esc(data.sender.name) + ' sent you this to sign.</p>' +
      (d.message.trim() ? '<p class="msg">' + esc(d.message.trim()) + '</p>' : '') +
      '<p class="steps"><strong>How it works:</strong> read the document, tap each gold box to fill it in, then type your name, tick the box and press Finish at the bottom.</p></div>' +
      '<div id="pages"><p class="status">Loading the document…</p></div>' +
      '<div class="bar"><label for="fullname">Your full name</label><input type="text" id="fullname" autocomplete="name" maxlength="120" value="' + esc(me.name) + '">' +
      '<label class="agree"><input type="checkbox" id="agree"><span>I agree to sign this document electronically. My electronic signature has the same effect as signing on paper.</span></label>' +
      '<p class="err" id="err" role="alert"></p>' +
      '<div class="row"><button class="btn" type="button" id="finish">Finish and sign</button><button class="link" type="button" id="decline">Decline to sign</button></div></div>' +
      '<button type="button" id="nextBtn">Start</button>';
    document.getElementById("nextBtn").addEventListener("click", function () {
      var n = document.querySelector(".fld.next");
      (n || document.querySelector(".bar")).scrollIntoView({ behavior: "smooth", block: "center" });
      if (!n) document.getElementById("fullname").focus({ preventScroll: true });
    });
    document.getElementById("finish").addEventListener("click", finish);
    document.getElementById("decline").addEventListener("click", declineIt);
    document.getElementById("fullname").addEventListener("input", refreshAuto);
    drawPdf();
  }

  function drawPdf() {
    var pagesEl = document.getElementById("pages");
    if (!data.pdf_url) { pagesEl.innerHTML = '<p class="err">The document couldn\'t be loaded. Please reload the page.</p>'; return; }
    pdfjsLib.GlobalWorkerOptions.workerSrc = "/assets/pdfjs/pdf.worker.min.js";
    pdfjsLib.getDocument({ url: data.pdf_url }).promise.then(function (pdf) {
      pagesEl.innerHTML = "";
      var chain = Promise.resolve();
      for (var n = 1; n <= pdf.numPages; n++) (function (n) {
        chain = chain.then(function () { return pdf.getPage(n); }).then(function (page) {
          var width = Math.min(pagesEl.clientWidth || 800, 860);
          var base = page.getViewport({ scale: 1 });
          var scale = (width / base.width) * Math.min(window.devicePixelRatio || 1, 2);
          var vp = page.getViewport({ scale: scale });
          var holder = document.createElement("div"); holder.className = "page"; holder.dataset.page = n;
          var canvas = document.createElement("canvas"); canvas.width = vp.width; canvas.height = vp.height;
          holder.appendChild(canvas);
          var num = document.createElement("span"); num.className = "num"; num.textContent = "Page " + n + " of " + pdf.numPages; holder.appendChild(num);
          pagesEl.appendChild(holder);
          placeFields(holder, n);
          return page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
        });
      })(n);
      return chain;
    }).then(markNext).catch(function () { pagesEl.innerHTML = '<p class="err">The document couldn\'t be loaded. Please reload the page.</p>'; });
  }

  var LABEL = { signature: "Sign here", initials: "Initials", name: "Name", date: "Date", text: "Fill in" };
  function placeFields(holder, pageNo) {
    data.fields.filter(function (f) { return f.page === pageNo; }).forEach(function (f) {
      var el = document.createElement(f.kind === "text" ? "div" : "button");
      if (f.kind !== "text") el.type = "button";
      el.className = "fld"; el.dataset.id = f.id; el.dataset.kind = f.kind;
      el.style.left = (f.x * 100) + "%"; el.style.top = (f.y * 100) + "%"; el.style.width = (f.w * 100) + "%"; el.style.height = (f.h * 100) + "%";
      if (f.kind === "signature") { el.textContent = LABEL.signature; el.setAttribute("aria-label", "Add your signature"); el.addEventListener("click", openPad); }
      else if (f.kind === "text") {
        var input = document.createElement("input"); input.type = "text"; input.maxLength = 500; input.placeholder = f.label || LABEL.text;
        input.setAttribute("aria-label", f.label || "Fill in"); input.dataset.required = f.required ? "1" : "";
        input.addEventListener("input", function () { values[f.id] = input.value; el.classList.toggle("done", !!input.value.trim()); markNext(); });
        el.appendChild(input);
      } else { el.classList.add("auto"); el.disabled = true; }
      holder.appendChild(el);
    });
    refreshAuto();
  }

  function initialsOf(name) { return name.trim().split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 6).toUpperCase(); }
  function refreshAuto() {
    var name = (document.getElementById("fullname") || {}).value || "";
    document.querySelectorAll(".fld").forEach(function (el) {
      var k = el.dataset.kind;
      if (k === "name") { el.textContent = name.trim() || LABEL.name; el.classList.toggle("done", !!name.trim()); }
      if (k === "date") { el.textContent = today(); el.classList.add("done"); }
      if (k === "initials") { el.textContent = initialsOf(name) || LABEL.initials; el.classList.toggle("done", !!name.trim()); }
    });
  }
  function markNext() {
    var found = false;
    document.querySelectorAll(".fld").forEach(function (el) {
      el.classList.remove("next");
      var pending = (el.dataset.kind === "signature" && !signature) || (el.dataset.kind === "text" && el.querySelector("input").dataset.required && !el.querySelector("input").value.trim());
      if (pending && !found) { el.classList.add("next"); found = true; }
    });
    var nb = document.getElementById("nextBtn");
    if (nb) nb.textContent = found ? (signature || Object.keys(values).length ? "Next box" : "Start") : "Go to Finish";
  }

  // ---- The signature pad: draw with a finger or mouse, or type the name in a script font. ----
  function openPad() {
    var back = document.createElement("div"); back.className = "dialog-back";
    back.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="padTitle"><h2 id="padTitle">Add your signature</h2>' +
      '<div class="tabs"><button type="button" id="tabDraw" aria-pressed="true">Draw</button><button type="button" id="tabType" aria-pressed="false">Type</button></div>' +
      '<canvas id="pad" width="1040" height="360" aria-label="Draw your signature here"></canvas>' +
      '<input id="typed" type="text" maxlength="60" hidden aria-label="Type your name" autocomplete="name">' +
      '<p class="err" id="padErr" role="alert"></p>' +
      '<div class="row"><button class="btn out" type="button" id="padClear">Clear</button><button class="btn out" type="button" id="padCancel">Cancel</button><button class="btn" type="button" id="padUse">Use this</button></div></div>';
    document.body.appendChild(back);
    var pad = back.querySelector("#pad"), typed = back.querySelector("#typed"), ctx = pad.getContext("2d");
    var drawing = false, drew = false, mode = "draw";
    ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1B1F2B";
    function pos(e) { var r = pad.getBoundingClientRect(); return { x: (e.clientX - r.left) * pad.width / r.width, y: (e.clientY - r.top) * pad.height / r.height }; }
    pad.addEventListener("pointerdown", function (e) { drawing = true; drew = true; pad.setPointerCapture(e.pointerId); var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.1, p.y + 0.1); ctx.stroke(); });
    pad.addEventListener("pointermove", function (e) { if (!drawing) return; var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
    ["pointerup", "pointercancel"].forEach(function (n) { pad.addEventListener(n, function () { drawing = false; }); });
    function setMode(m) {
      mode = m; pad.hidden = m !== "draw"; typed.hidden = m !== "type";
      back.querySelector("#tabDraw").setAttribute("aria-pressed", m === "draw"); back.querySelector("#tabType").setAttribute("aria-pressed", m === "type");
      if (m === "type") { if (!typed.value) typed.value = (document.getElementById("fullname").value || "").trim(); typed.focus(); }
    }
    back.querySelector("#tabDraw").addEventListener("click", function () { setMode("draw"); });
    back.querySelector("#tabType").addEventListener("click", function () { setMode("type"); });
    back.querySelector("#padClear").addEventListener("click", function () { ctx.clearRect(0, 0, pad.width, pad.height); drew = false; typed.value = ""; });
    function close() { back.remove(); }
    back.querySelector("#padCancel").addEventListener("click", close);
    back.addEventListener("click", function (e) { if (e.target === back) close(); });
    back.querySelector("#padUse").addEventListener("click", function () {
      var out, c;
      if (mode === "draw") {
        if (!drew) { back.querySelector("#padErr").textContent = "Draw your signature in the box first."; return; }
        out = pad.toDataURL("image/png");
      } else {
        var text = typed.value.trim();
        if (text.length < 2) { back.querySelector("#padErr").textContent = "Type your name first."; return; }
        c = document.createElement("canvas"); c.width = 1040; c.height = 360;
        var x = c.getContext("2d"); x.fillStyle = "#1B1F2B"; x.textAlign = "center"; x.textBaseline = "middle";
        var size = 150; do { x.font = size + 'px "Sign Script", cursive'; size -= 6; } while (x.measureText(text).width > 980 && size > 40);
        x.fillText(text, 520, 190);
        out = c.toDataURL("image/png");
      }
      out = trimmed(mode === "draw" ? pad : c) || out;
      signature = out;
      document.querySelectorAll('.fld[data-kind="signature"]').forEach(function (el) {
        el.innerHTML = ""; var img = document.createElement("img"); img.src = out; img.alt = "Your signature"; el.appendChild(img); el.classList.add("done");
      });
      close(); markNext();
    });
  }

  /** The signature cut down to its ink (plus a small margin), so it fills its box on the document. */
  function trimmed(canvas) {
    try {
      var w = canvas.width, h = canvas.height, d = canvas.getContext("2d").getImageData(0, 0, w, h).data;
      var x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 < 0) return null;
      var m = 14; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
      var o = document.createElement("canvas"); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
      o.getContext("2d").drawImage(canvas, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      return o.toDataURL("image/png");
    } catch (e) { return null; }
  }

  function finish() {
    if (busy) return;
    var err = document.getElementById("err"), name = document.getElementById("fullname").value.trim();
    err.textContent = "";
    var missingText = Array.prototype.some.call(document.querySelectorAll('.fld[data-kind="text"] input'), function (i) { return i.dataset.required && !i.value.trim(); });
    if (!signature) { err.textContent = REASONS.signature_needed; scrollToNext(); return; }
    if (missingText) { err.textContent = REASONS.field_needed; scrollToNext(); return; }
    if (name.length < 2) { err.textContent = REASONS.name_needed; return; }
    if (!document.getElementById("agree").checked) { err.textContent = REASONS.consent_needed; return; }
    busy = true; var b = document.getElementById("finish"); b.disabled = true; b.textContent = "Signing…";
    call({ action: "sign", token: token, consent: true, typed_name: name, signature: signature, values: values, date: today(), initials: initialsOf(name) }).then(function (res) {
      busy = false;
      if (!res.ok) { b.disabled = false; b.textContent = "Finish and sign"; err.textContent = reasonText(res); return; }
      load(); window.scrollTo(0, 0);
    }).catch(function () { busy = false; b.disabled = false; b.textContent = "Finish and sign"; err.textContent = "Check your connection and try again."; });
  }
  function scrollToNext() { var n = document.querySelector(".fld.next"); if (n) n.scrollIntoView({ behavior: "smooth", block: "center" }); }

  function declineIt() {
    if (busy) return;
    var back = document.createElement("div"); back.className = "dialog-back";
    back.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="decTitle"><h2 id="decTitle">Decline to sign?</h2>' +
      '<p class="note">' + esc(data.sender.name) + ' will be told, and the document will be closed.</p>' +
      '<label for="decReason" style="display:block;font-weight:600;font-size:13px;margin:10px 0 4px">Reason (optional)</label>' +
      '<input id="decReason" type="text" maxlength="500" style="width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #D9D3C7;border-radius:12px;font:inherit;font-size:16px">' +
      '<div class="row"><button class="btn out" type="button" id="decNo">Go back</button><button class="btn" type="button" id="decYes">Decline</button></div></div>';
    document.body.appendChild(back);
    back.querySelector("#decNo").addEventListener("click", function () { back.remove(); });
    back.querySelector("#decYes").addEventListener("click", function () {
      busy = true;
      call({ action: "decline", token: token, reason: back.querySelector("#decReason").value }).then(function () { busy = false; back.remove(); load(); })
        .catch(function () { busy = false; back.remove(); });
    });
  }
})();
</script>
