        out = pad.toDataURL("image/png");
      } else {
        var text = typed.value.trim();
        if (text.length < 2) { back.querySelector("#padErr").textContent = "Type your name first."; return; }
        c = document.createElement("canvas"); c.width = 1040; c.height = 360;
        var x = c.getContext("2d"); x.fillStyle = "#1B1F2B"; x.textAlign = "center"; x.textBaseline = "middle";
        var size = 150; do { x.font = size + 'px "Sign Script", cursive'; size -= 6; } while (x.measureText(text).width > 980 && size > 40);
        x.fillText(text, 520, 190);
        out = c.toDataURL("image/png");
      }
      out = trimmed(mode === "draw" ? pad : c) || out;
      signature = out;
      if (target && target.dataset) applied[target.dataset.id] = true;
      // The box they tapped, plus any they had already signed (so a redone signature is the same everywhere).
      document.querySelectorAll('.fld[data-kind="signature"]').forEach(function (el) { if (applied[el.dataset.id]) showSignature(el); });
      close(); advance();
    });
  }

  /** The signature cut down to its ink (plus a small margin), so it fills its box on the document. */
  function trimmed(canvas) {
    try {
      var w = canvas.width, h = canvas.height, d = canvas.getContext("2d").getImageData(0, 0, w, h).data;
      var x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 < 0) return null;
      var m = 14; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
      var o = document.createElement("canvas"); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
      o.getContext("2d").drawImage(canvas, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      return o.toDataURL("image/png");
    } catch (e) { return null; }
  }

  function finish() {
    if (busy) return;
    var err = document.getElementById("err"), name = document.getElementById("fullname").value.trim();
    err.textContent = "";
    var pending = markNext();
    if (pending) { err.textContent = pending.dataset.kind === "signature" ? "Please sign in every Sign here box (" + document.querySelectorAll('.fld[data-kind="signature"]').length + " in this document)." : REASONS.field_needed; scrollToNext(); return; }
    if (!signature) { err.textContent = REASONS.signature_needed; return; }
    if (name.length < 2) { err.textContent = REASONS.name_needed; return; }
    var email = isTemplate ? document.getElementById("email").value.trim() : "";
    if (isTemplate && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = REASONS.email_needed; return; }
    if (!document.getElementById("agree").checked) { err.textContent = REASONS.consent_needed; return; }
    busy = true; var b = document.getElementById("finish"); b.disabled = true; b.textContent = "Signing…";
    var payload = { action: isTemplate ? "sign_template" : "sign", consent: true, typed_name: name, signature: signature, values: values, date: today(), initials: initialsOf(name) };
    if (isTemplate) { payload.public = pub; payload.email = email; } else payload.token = token;
    call(payload).then(function (res) {
      busy = false;
      if (!res.ok) { b.disabled = false; b.textContent = "Finish and sign"; err.textContent = reasonText(res); return; }
      window.scrollTo(0, 0);
      if (isTemplate) {
        // Each person gets their own finished copy right away (and by email).
        return box("Thanks, you've signed", 'Your signed copy of "' + data.document.title + '" was emailed to ' + email + ".",
          res.body.pdf_url ? '<p><a class="btn" href="' + esc(res.body.pdf_url) + '" target="_blank" rel="noopener">Download your signed copy</a></p>' : "");
      }
      load();
    }).catch(function () { busy = false; b.disabled = false; b.textContent = "Finish and sign"; err.textContent = "Check your connection and try again."; });
  }
  function scrollToNext() { var n = document.querySelector(".fld.next"); if (n) n.scrollIntoView({ behavior: "smooth", block: "center" }); }

  function declineIt() {
    if (busy) return;
    var back = document.createElement("div"); back.className = "dialog-back";
    back.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="decTitle"><h2 id="decTitle">Decline to sign?</h2>' +
      '<p class="note">' + esc(data.sender.name) + ' will be told, and the document will be closed.</p>' +
      '<label for="decReason" style="display:block;font-weight:600;font-size:13px;margin:10px 0 4px">Reason (optional)</label>' +
      '<input id="decReason" type="text" maxlength="500" style="width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #D9D3C7;border-radius:12px;font:inherit;font-size:16px">' +
      '<div class="row"><button class="btn out" type="button" id="decNo">Go back</button><button class="btn" type="button" id="decYes">Decline</button></div></div>';
    document.body.appendChild(back);
    back.querySelector("#decNo").addEventListener("click", function () { back.remove(); });
    back.querySelector("#decYes").addEventListener("click", function () {
      busy = true;
      call({ action: "decline", token: token, reason: back.querySelector("#decReason").value }).then(function () { busy = false; back.remove(); load(); })
        .catch(function () { busy = false; back.remove(); });
    });
  }
})();
</script>
</body>
</html>
