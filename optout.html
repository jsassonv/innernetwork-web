<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src https://dwfuvfcjptvycqyedetb.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Stop event emails · Inner Network</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2">
<link rel="stylesheet" href="/assets/hosted.css?v=4">
<!--
  Stop all event emails (2081): for people who aren't members and got invitations from Inner Network hosts. We email a
  confirmation link to the address, so nobody can opt out someone else. Texts stop with a STOP reply.
-->
</head>
<body>
<div class="wrap">
  <a class="brand" href="/"><img src="/assets/logo.png" alt="">Inner Network</a>
  <main id="main"><p class="status">Loading…</p></main>
  <footer>&copy; 2026 WAVECODE LLC · <a href="/privacy-policy.html">Privacy Policy</a> · <a href="/terms.html">SMS Terms</a></footer>
</div>
<script src="/assets/hosted.js?v=8"></script>
<script>
(function () {
  var H = window.HOSTED, t = H.t, esc = H.esc;
  var main = document.getElementById("main");
  if (new URLSearchParams(location.search).get("done") === "1") {
    main.innerHTML = '<section class="panel"><h1>' + t("You're opted out") + '</h1><p class="text">' + t("You won't get event emails from any Inner Network host at this address.") + '</p></section>';
    return;
  }
  main.innerHTML =
    '<section class="panel"><h1>' + t("Stop event emails") + '</h1>' +
    '<p class="text">' + t("Enter your email and we'll send a link to confirm. After that, no Inner Network host can email you about events at this address.") + '</p>' +
    '<form id="f" novalidate><label>' + t("Email") + '<input name="email" type="email" autocomplete="email" maxlength="200" required></label>' +
    '<p class="err" id="err" role="alert"></p><button class="btn" type="submit">' + t("Send the link") + '</button></form>' +
    '<p class="note" style="margin-top:14px">' + t("To stop texts, reply STOP to any text from us.") + '</p></section>';
  var form = document.getElementById("f"), err = document.getElementById("err");
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var email = form.elements.email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = t("Please enter your email."); return; }
    err.textContent = t("Sending…");
    H.post("?format=optout", { email: email, lang: H.SPANISH ? "es" : "en" }).then(function (r) {
      main.innerHTML = r.ok ? '<section class="panel"><h1>' + t("Check your email") + '</h1><p class="text">' + t("Open the link we sent to finish.") + '</p></section>'
        : '<p class="status">' + t(r.status === 429 ? "Too many tries. Please wait a few minutes." : "That didn't work. Please try again.") + '</p>';
    }).catch(function () { err.textContent = t("That didn't work. Please try again."); });
  });
})();
</script>
</body>
</html>
